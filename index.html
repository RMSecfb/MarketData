<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金融市場每日監控指標</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0d0f17;--card:#13161f;--card2:#181b26;--border:#222537;--accent:#4da6ff;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--text:#dde2f0;--text2:#7a83a0;--text3:#454d66;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;--r:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans TC",sans-serif;font-size:14px;padding-bottom:70px}
.hdr{position:sticky;top:0;z-index:20;background:rgba(13,15,23,.96);border-bottom:1px solid var(--border);padding:13px 16px}.hdr-in,.tabs,.page{max-width:820px;margin:auto}.hdr-in{display:flex;justify-content:space-between;align-items:center}.title{font-size:16px;font-weight:700;color:var(--accent)}.hdr-r{display:flex;gap:8px;align-items:center}.badge,.btn{border:1px solid var(--border);border-radius:6px;background:var(--card2);color:var(--text2);padding:5px 10px;font-size:12px}.btn{cursor:pointer}.btn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);padding:12px 12px 0}.tab{white-space:nowrap;padding:9px 18px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:var(--text2);cursor:pointer}.tab.active{background:var(--card);border-color:var(--border);color:var(--accent)}.tab-content{display:none}.tab-content.active{display:block}.page{padding:0 12px}
.dnav{display:flex;gap:8px;padding:14px 0 8px}.dnav select{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px}.status{font:11px var(--mono);color:var(--text3);padding-bottom:10px}
.card,.mon-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px}.card{padding:15px}.sec{display:flex;align-items:center;gap:7px;padding:18px 0 10px;border-bottom:1px solid var(--border);margin-bottom:12px}.sec b{color:var(--accent);font-size:15px}.tag,.ddate{font:10px var(--mono);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--text3)}
table{width:100%;border-collapse:collapse}.mon-card{overflow:auto}th{background:#1a1f35;color:var(--accent);font-size:12px;padding:10px;text-align:center}td{border-top:1px solid var(--border);padding:9px 10px;text-align:center;font:12px var(--mono);color:var(--text2)}th:first-child,td:first-child{text-align:left}.up{color:var(--red)}.dn{color:var(--green)}.ok{color:var(--green)}.warn{color:var(--yellow)}.danger{color:var(--red)}
.stale-ok{border-color:rgba(34,197,94,.25)}.stale-warn{border-color:rgba(245,158,11,.4)}.stale-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:9px}.stale-item{background:var(--card2);border:1px solid var(--border);padding:9px;border-radius:7px;font-size:11px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}.manual-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px}.manual-card.stale{border-color:rgba(245,158,11,.4)}.manual-card.active{border-color:rgba(77,166,255,.5)}.meta{font:11px/1.7 var(--mono);color:var(--text3);margin:7px 0 10px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.inputs input,.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px}.lbl{font-size:10px;color:var(--text3);margin-bottom:4px}.primary{background:linear-gradient(135deg,#2563eb,#0ea5e9);border:0;color:#fff;padding:8px 15px;border-radius:7px;cursor:pointer}.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:160px}.toast{font-size:12px;color:var(--green)}.err{font-size:12px;color:var(--red)}
.cds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}.cds-box{background:var(--card2);padding:10px;border-radius:8px;border:1px solid var(--border)}.cds-box input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px;border-radius:6px;text-align:center}
.chart{height:330px}.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.muted{color:var(--text3);font-size:11px;line-height:1.7}.empty{text-align:center;color:var(--text3);padding:24px}
@media(max-width:560px){.tabs{padding-left:8px}.tab{padding:8px 12px}.inputs{grid-template-columns:1fr}.hdr-r .badge{display:none}}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in"><div class="title">📊 金融市場監控指標</div><div class="hdr-r"><span id="hdrDate" class="badge">—</span><button class="btn" onclick="loadSelected()">⟳ 更新</button></div></div></div>
<div class="tabs">
<button class="tab active" onclick="switchTab('monitor',this)">📊 每日監控</button>
<button class="tab" onclick="switchTab('trend',this)">📈 趨勢圖</button>
<button class="tab" onclick="switchTab('settings',this)">⚙️ 設定</button>
<button class="tab" onclick="switchTab('manual',this)">✏️ 人工維護數值</button>
</div>

<div id="tab-monitor" class="tab-content active"><div class="page">
<div class="dnav"><button class="btn" onclick="shiftDate(-1)">‹ 前一天</button><select id="dateSel" onchange="loadSelected()"></select><button class="btn" onclick="shiftDate(1)">後一天 ›</button></div>
<div id="status" class="status">載入中…</div>
<div id="staleDisclosure" class="card" style="display:none"></div>
<div class="sec"><span>📡</span><b>預警分析</b></div>
<div class="mon-card"><table><thead><tr><th>指標</th><th>數值</th><th>變化</th><th>資料日</th><th>狀態</th></tr></thead><tbody id="marketBody"></tbody></table></div>
<div class="sec"><span>📉</span><b>主要個股資訊</b></div>
<div class="mon-card"><table><thead><tr><th>名稱</th><th>收盤價</th><th>漲跌%</th><th>資料日</th><th>等級</th></tr></thead><tbody id="stockBody"></tbody></table></div>
<div class="sec"><span>🌏</span><b>主要國家資訊</b><span class="tag">手動維護</span></div>
<div class="mon-card"><table><thead><tr><th>國家 CDS (5Y)</th><th>數值</th><th>變化</th><th>資料日</th></tr></thead><tbody id="cdsBody"></tbody></table></div>
<div class="card">
<div class="row"><div style="flex:1"><b>✏️ 手動維護 CDS</b><div class="muted">對應報表日：<span id="cdsDate"></span></div></div><span id="cdsToast" class="toast"></span><button class="primary" onclick="saveCDS()">💾 儲存 CDS</button></div>
<div id="cdsGrid" class="cds-grid" style="margin-top:12px"></div>
</div>
</div></div>

<div id="tab-trend" class="tab-content"><div class="page">
<div class="sec"><span>📈</span><b>趨勢圖</b></div>
<div class="card"><div class="row"><div class="field"><div class="lbl">指標</div><select id="trendMetric" onchange="renderTrend()"><option value="vix">VIX</option><option value="move">MOVE</option><option value="y2">2Y</option><option value="y10">10Y</option><option value="y30">30Y</option><option value="sox">SOX</option></select></div><div class="field"><div class="lbl">天數</div><select id="trendDays" onchange="renderTrend()"><option>10</option><option selected>30</option><option>60</option></select></div></div></div>
<div class="card chart"><canvas id="trendChart"></canvas></div>
</div></div>

<div id="tab-settings" class="tab-content"><div class="page">
<div class="sec"><span>⚙️</span><b>設定</b></div>
<div class="card"><div class="muted">警示門檻與個股清單讀取自 config.json。這一頁保留公司 GitHub 寫入能力；若瀏覽器尚未保存 Token，儲存時會要求輸入。</div></div>
<div id="thresholdGrid" class="settings-grid"></div>
<div class="card"><div class="row"><button class="primary" onclick="saveConfig()">💾 儲存門檻設定</button><span id="cfgMsg"></span></div></div>
</div></div>

<div id="tab-manual" class="tab-content"><div class="page">
<div class="sec"><span>✏️</span><b>人工維護數值</b><span class="tag">manual override</span></div>
<div class="card"><div class="row"><div class="field"><div class="lbl">報表日 / 寫入日期</div><input type="date" id="manualDate"></div><button class="btn" onclick="loadManual()">⟳ 載入</button><label style="font-size:12px;color:var(--text2)"><input type="checkbox" id="showAll" onchange="renderManual()"> 顯示全部</label></div><div id="manualSummary" class="muted" style="margin-top:10px"></div></div>
<div id="manualGrid" class="grid"></div>
<div class="card"><div class="row" style="justify-content:flex-end"><span id="manualMsg"></span><button class="primary" onclick="saveManual()">💾 儲存人工維護</button></div><div class="muted" style="margin-top:10px">人工覆蓋獨立儲存於 data/manual_override.json；顯示時人工值優先，自動 JSON 原值不被改寫。</div></div>
</div></div>

<script>
const GH_REPO='RMSecfb/MarketData', MANUAL_PATH='data/manual_override.json';
let CFG={thresholds:{},stocks:[],display:{history_days:60}}, currentRaw=null,currentData=null,manualRaw=null,manualStore={},trendChart=null;
const CDS=[['US','美國','🇺🇸'],['KR','南韓','🇰🇷'],['JP','日本','🇯🇵'],['CN','中國','🇨🇳'],['HK','香港','🇭🇰']];

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=v=>Number.isFinite(Number(v))?Number(v):null;
const fmt=v=>num(v)==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:4});
const iso=d=>d.toISOString().slice(0,10);
function switchTab(id,b){document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');b.classList.add('active');if(id==='manual'){document.getElementById('manualDate').value=document.getElementById('dateSel').value;loadManual()}if(id==='trend')renderTrend()}
async function jfetch(path){const r=await fetch('./'+path+'?t='+Date.now());if(!r.ok)throw Error(path+' HTTP '+r.status);return r.json()}
async function loadConfig(){try{CFG=await jfetch('config.json')}catch(e){} renderSettings()}
function businessDays(n){let d=new Date(),a=[];d.setDate(d.getDate()-1);while(a.length<n){if(d.getDay()!=0&&d.getDay()!=6)a.push(iso(d));d.setDate(d.getDate()-1)}return a}
function initDates(){const s=document.getElementById('dateSel');s.innerHTML=businessDays(CFG.display?.history_days||60).map(x=>`<option>${x}</option>`).join('')}
function shiftDate(n){const s=document.getElementById('dateSel'),i=Math.max(0,Math.min(s.options.length-1,s.selectedIndex+n));s.selectedIndex=i;loadSelected()}
async function getManualStore(){try{return await jfetch(MANUAL_PATH)}catch(e){return {}}}
function applyOne(e,o,report){if(!o||num(o.value)==null)return e;let v=Number(o.value),p=num(e?.prev);return {...(e||{}),value:v,date:o.data_date||report,target_date:report,is_stale:(o.data_date||report)!==report,source:'manual',prev:p,chg_abs:p==null?null:v-p,chg_pct:p&&p!==0?(v-p)/p*100:null}}
function applyManual(raw,store,report){let d=structuredClone(raw||{}),o=store?.[report]||{};['vix','move','y2','y10','y30','sox'].forEach(k=>{if(o[k])d[k]=applyOne(d[k],o[k],report)});d.stocks=d.stocks||{};Object.entries(o.stocks||{}).forEach(([k,v])=>d.stocks[k]=applyOne(d.stocks[k],v,report));return d}
async function loadSelected(){const report=document.getElementById('dateSel').value;document.getElementById('status').textContent='載入中…';try{currentRaw=await jfetch(`data/market_${report}.json`);manualStore=await getManualStore();currentData=applyManual(currentRaw,manualStore,report);document.getElementById('hdrDate').textContent=report;document.getElementById('status').textContent='● 資料載入完成';renderAll()}catch(e){document.getElementById('status').textContent='❌ '+e.message}}
function entryRows(d){return [['VIX','vix'],['MOVE','move'],['2Y 公債','y2'],['10Y 公債','y10'],['30Y 公債','y30'],['SOX','sox']].map(([l,k])=>[l,k,d?.[k]])}
function renderAll(){let r=document.getElementById('dateSel').value;renderStale(r);document.getElementById('marketBody').innerHTML=entryRows(currentData).map(([l,k,e])=>`<tr><td>${l}</td><td>${fmt(e?.value)}</td><td class="${num(e?.chg_pct)>0?'up':num(e?.chg_pct)<0?'dn':''}">${num(e?.chg_pct)==null?'—':(e.chg_pct>0?'+':'')+e.chg_pct.toFixed(2)+'%'}</td><td>${e?.date||'—'}${e?.source==='manual'?' ✏️':''}</td><td>${statusFor(k,e)}</td></tr>`).join('');document.getElementById('stockBody').innerHTML=(CFG.stocks||[]).map(s=>{let e=currentData?.stocks?.[s.symbol];return `<tr><td>${esc(s.emoji||'')} ${esc(s.symbol)} ${esc(s.name||'')}</td><td>${fmt(e?.value)}</td><td class="${num(e?.chg_pct)>0?'up':num(e?.chg_pct)<0?'dn':''}">${num(e?.chg_pct)==null?'—':(e.chg_pct>0?'+':'')+e.chg_pct.toFixed(2)+'%'}</td><td>${e?.date||'—'}${e?.source==='manual'?' ✏️':''}</td><td>${esc(s.grade||e?.grade||'—')}</td></tr>`}).join('');renderCDS()}
function statusFor(k,e){if(!e)return '<span class="danger">缺資料</span>';let t=CFG.thresholds||{},v=num(e.value),c='ok',txt='正常';if(k==='vix'||k==='move'){let x=t[k];if(x&&v>=x.danger){c='danger';txt='第二警示'}else if(x&&v>=x.warn){c='warn';txt='第一警示'}}return `<span class="${c}">${txt}</span>`}
function renderStale(report){let a=[];entryRows(currentData).forEach(([l,k,e])=>{if(e&&e.date!==report)a.push([l,e])});(CFG.stocks||[]).forEach(s=>{let e=currentData?.stocks?.[s.symbol];if(e&&e.date!==report)a.push([s.symbol,e])});let b=document.getElementById('staleDisclosure');b.style.display='';if(!a.length){b.className='card stale-ok';b.innerHTML=`<b class="ok">✅ 所有指標與股票資料皆為 ${report}</b>`}else{b.className='card stale-warn';b.innerHTML=`<b class="warn">⚠ 非同日資料：${a.length} 項</b><div class="muted">以下資料日非報表日 ${report}</div><div class="stale-grid">${a.map(([l,e])=>`<div class="stale-item"><b>${esc(l)}</b><br>資料日：${e.date}<br>數值：${fmt(e.value)}${e.source==='manual'?'<br>✏️ 人工覆蓋':''}</div>`).join('')}</div>`}}
function renderCDS(){let r=document.getElementById('dateSel').value;document.getElementById('cdsDate').textContent=r;document.getElementById('cdsBody').innerHTML=CDS.map(([k,n,f])=>{let e=currentData?.cds?.[k];return `<tr><td>${f} ${n}</td><td>${fmt(e?.value)}</td><td>${num(e?.chg_abs)==null?'—':(e.chg_abs>0?'+':'')+e.chg_abs.toFixed(2)}</td><td>${e?.date||'—'}</td></tr>`}).join('');document.getElementById('cdsGrid').innerHTML=CDS.map(([k,n,f])=>`<div class="cds-box"><div class="lbl">${f} ${n} CDS (bps)</div><input id="cds_${k}" type="number" step="0.01" value="${currentData?.cds?.[k]?.value??''}"></div>`).join('')}
async function token(){let t=localStorage.getItem('gh_token');if(t)return t;t=prompt('請輸入可寫入 RMSecfb/MarketData 的 GitHub Token：');if(t)localStorage.setItem('gh_token',t);return t}
async function putJson(path,obj,msg){let t=await token();if(!t)throw Error('未提供 Token');let u=`https://api.github.com/repos/${GH_REPO}/contents/${path}`,g=await fetch(u,{headers:{Authorization:`Bearer ${t}`,Accept:'application/vnd.github+json'}}),sha=null;if(g.ok)sha=(await g.json()).sha;let content=btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2))));let p=await fetch(u,{method:'PUT',headers:{Authorization:`Bearer ${t}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:msg,content,...(sha?{sha}:{})})});if(!p.ok){if(p.status===401||p.status===403)localStorage.removeItem('gh_token');throw Error((await p.json()).message||('HTTP '+p.status))}}
async function saveCDS(){let report=document.getElementById('dateSel').value,d=structuredClone(currentRaw||{}),cds={};CDS.forEach(([k,n,f])=>{let v=num(document.getElementById('cds_'+k).value),old=currentData?.cds?.[k],p=num(old?.prev);cds[k]=v==null?null:{value:v,prev:p,chg_abs:p==null?null:v-p,chg_pct:p&&p!==0?(v-p)/p*100:null,date:report,name:n,flag:f}});d.cds=cds;d.cds_updated_at=new Date().toISOString();try{await putJson(`data/market_${report}.json`,d,`Manual CDS update: ${report}`);let latest=await jfetch('data/latest.json').catch(()=>null);if(latest?.target_date===report)await putJson('data/latest.json',{...latest,cds,cds_updated_at:d.cds_updated_at},`Manual CDS latest: ${report}`);document.getElementById('cdsToast').textContent='✅ 已儲存';currentRaw=d;currentData=applyManual(d,manualStore,report);renderAll()}catch(e){document.getElementById('cdsToast').innerHTML='<span class="err">❌ '+esc(e.message)+'</span>'}}
function manualItems(d){let a=[['vix','VIX'],['move','MOVE'],['y2','2Y 公債'],['y10','10Y 公債'],['y30','30Y 公債'],['sox','SOX']];(CFG.stocks||[]).forEach(s=>a.push(['stock:'+s.symbol,s.symbol+' '+(s.name||'')]));return a.map(([k,l])=>[k,l,k.startsWith('stock:')?d?.stocks?.[k.slice(6)]:d?.[k]])}
async function loadManual(){let r=document.getElementById('manualDate').value;try{manualRaw=await jfetch(`data/market_${r}.json`);manualStore=await getManualStore();renderManual()}catch(e){document.getElementById('manualSummary').textContent='❌ '+e.message}}
function renderManual(){if(!manualRaw)return;let r=document.getElementById('manualDate').value,o=manualStore?.[r]||{},all=document.getElementById('showAll').checked,items=manualItems(manualRaw),stale=items.filter(x=>x[2]?.date&&x[2].date!==r).length;document.getElementById('manualSummary').textContent=`報表日 ${r} · 自動資料非同日 ${stale} 項${all?' · 顯示全部':' · 僅顯示非同日/已覆蓋'}`;let vis=items.filter(([k,l,e])=>{let z=k.startsWith('stock:')?o.stocks?.[k.slice(6)]:o[k];return all||z||(e?.date&&e.date!==r)});document.getElementById('manualGrid').innerHTML=vis.length?vis.map(([k,l,e])=>{let z=k.startsWith('stock:')?o.stocks?.[k.slice(6)]:o[k],id=k.replace(':','__');return `<div class="manual-card ${e?.date!==r?'stale':''} ${z?'active':''}"><b>${esc(l)}</b><div class="meta">自動值：${fmt(e?.value)}<br>自動資料日：${e?.date||'—'}<br>來源：${esc(e?.source||'—')}${z?'<br>✏️ 已有人工覆蓋':''}</div><div class="inputs"><div><div class="lbl">人工值</div><input id="mv_${id}" type="number" step="any" value="${z?.value??''}"></div><div><div class="lbl">人工資料日</div><input id="md_${id}" type="date" value="${z?.data_date||r}"></div></div></div>`}).join(''):'<div class="empty">目前沒有非同日資料；勾選「顯示全部」可修正同日數值。</div>'}
async function saveManual(){let r=document.getElementById('manualDate').value,day={},stocks={};manualItems(manualRaw).forEach(([k])=>{let id=k.replace(':','__'),el=document.getElementById('mv_'+id);if(!el||el.value==='')return;let rec={value:Number(el.value),data_date:document.getElementById('md_'+id).value||r,updated_at:new Date().toISOString()};if(k.startsWith('stock:'))stocks[k.slice(6)]=rec;else day[k]=rec});if(Object.keys(stocks).length)day.stocks=stocks;let store=await getManualStore();if(Object.keys(day).length)store[r]=day;else delete store[r];try{await putJson(MANUAL_PATH,store,`Manual market override: ${r}`);manualStore=store;document.getElementById('manualMsg').innerHTML='<span class="toast">✅ 已儲存</span>';if(document.getElementById('dateSel').value===r)loadSelected();renderManual()}catch(e){document.getElementById('manualMsg').innerHTML='<span class="err">❌ '+esc(e.message)+'</span>'}}
function renderSettings(){let f=[['vix','VIX'],['move','MOVE'],['y2_bp_rise','2Y BP上升'],['y10_bp_rise','10Y BP上升'],['y30_bp_rise','30Y BP上升'],['sox_drop','SOX 下跌%']];document.getElementById('thresholdGrid').innerHTML=f.map(([k,l])=>{let t=CFG.thresholds?.[k]||{};return `<div class="card"><b>${l}</b><div class="inputs" style="margin-top:10px"><div><div class="lbl">第一警示</div><input id="tw_${k}" type="number" step="any" value="${t.warn??''}"></div><div><div class="lbl">第二警示</div><input id="td_${k}" type="number" step="any" value="${t.danger??''}"></div></div></div>`}).join('')}
async function saveConfig(){let f=['vix','move','y2_bp_rise','y10_bp_rise','y30_bp_rise','sox_drop'],n=structuredClone(CFG);n.thresholds=n.thresholds||{};f.forEach(k=>n.thresholds[k]={warn:Number(document.getElementById('tw_'+k).value),danger:Number(document.getElementById('td_'+k).value)});try{await putJson('config.json',n,'Update thresholds');CFG=n;document.getElementById('cfgMsg').innerHTML='<span class="toast">✅ 已儲存</span>'}catch(e){document.getElementById('cfgMsg').innerHTML='<span class="err">❌ '+esc(e.message)+'</span>'}}
async function renderTrend(){if(!document.getElementById('tab-trend').classList.contains('active'))return;let metric=document.getElementById('trendMetric').value,n=Number(document.getElementById('trendDays').value),dates=businessDays(n).reverse(),vals=[],labs=[];for(let d of dates){try{let x=await jfetch(`data/market_${d}.json`),s=await getManualStore(),y=applyManual(x,s,d),v=num(y?.[metric]?.value);if(v!=null){labs.push(d.slice(5));vals.push(v)}}catch(e){}}if(trendChart)trendChart.destroy();trendChart=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:labs,datasets:[{data:vals,borderColor:'#4da6ff',backgroundColor:'rgba(77,166,255,.12)',fill:true,tension:.25}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#7a83a0'},grid:{color:'#222537'}},y:{ticks:{color:'#7a83a0'},grid:{color:'#222537'}}}}})}
(async()=>{await loadConfig();initDates();document.getElementById('manualDate').value=document.getElementById('dateSel').value;await loadSelected()})();
</script>
</body>
